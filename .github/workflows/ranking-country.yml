name: Diagnose PineDrama country-specific ranking
on:
  push:
    paths:
      - scripts/diagnose-ranking-country.mjs
      - .github/workflows/ranking-country.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare verified ranking across non-auth country hints
        run: node scripts/diagnose-ranking-country.mjs
