name: Analyze Drive Videos with Gemini
on:
  schedule:
    # Avoid the busiest exact 00/05 minute slots; best-effort, not a guarantee.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  # One-time initial smoke run when this workflow file is deployed to main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/gemini-video-worker.yml"
permissions:
  contents: read
concurrency:
  group: anpi-gemini-video-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Process one Drive MP4 with Gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REELS_ENCRYPTION_KEY: ${{ secrets.REELS_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/gemini-video-worker.mjs
