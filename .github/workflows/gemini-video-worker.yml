name: Analyze Drive Videos with Gemini
# Gemini video processing is paused. No automatic calls or charges.
# Re-enable only by setting ENABLE_GEMINI_VIDEO_WORKER=true in Actions Variables
# AND explicitly invoking this workflow manually.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anpi-gemini-video-analysis
  cancel-in-progress: false
jobs:
  analyze:
    if: vars.ENABLE_GEMINI_VIDEO_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Process one Drive MP4 with Gemini
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REELS_ENCRYPTION_KEY: ${{ secrets.REELS_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/gemini-video-worker.mjs
