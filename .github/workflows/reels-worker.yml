name: Process Facebook Reels Queue
on:
  schedule:
    # Fallback only; a Supabase Cron wakeup can provide tighter dispatch.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  # Start a diagnostic job once when the worker code or workflow is deployed.
  push:
    branches: [main]
    paths:
      - ".github/workflows/reels-worker.yml"
      - "scripts/reels-worker.mjs"
      - "src/reels-upload.mjs"
permissions:
  contents: read
concurrency:
  group: pinedrama-reels-worker
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Process queue and reconcile pending reels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REELS_ENCRYPTION_KEY: ${{ secrets.REELS_ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REELS_BATCH_LIMIT: "3"
        run: node scripts/reels-worker.mjs
