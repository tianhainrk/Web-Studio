name: Locate original PineDrama series by native catalog
on:
  push:
    paths:
      - scripts/find-pinedrama-original.mjs
      - .github/workflows/find-pinedrama-series.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bounded public native metadata scan
        run: node scripts/find-pinedrama-original.mjs
